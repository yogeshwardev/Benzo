services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: skillforge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skillforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skillforge-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - skillforge-network

volumes:
  postgres_data:
  redis_data:

networks:
  skillforge-network:
    driver: bridge
