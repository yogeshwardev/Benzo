name: CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install shared dependencies
        run: cd shared && npm ci

      - name: Lint backend
        run: cd backend && npm run lint || true

      - name: Lint frontend
        run: cd frontend && npm run lint || true

      - name: Type check backend
        run: cd backend && npm run build

      - name: Type check frontend
        run: cd frontend && npm run type-check || true

  build:
    name: Build Applications
    runs-on: ubuntu-20.04
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Install shared dependencies
        run: cd shared && npm ci && npm run build

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build
          npx prisma generate

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.next

  security-scan:
    name: Security Scan
    runs-on: ubuntu-20.04
    needs: lint
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run backend npm audit
        run: cd backend && npm audit --audit-level=moderate || true

      - name: Run frontend npm audit
        run: cd frontend && npm audit --audit-level=moderate || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
