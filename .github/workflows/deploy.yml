name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [lint, test, build, security-scan]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/.next

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          # Deploy backend
          scp -i ~/.ssh/deploy_key -r backend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/backend-backup/
          scp -i ~/.ssh/deploy_key -r frontend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/frontend-backup/
          
          # Copy new files
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" backend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/backend/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" frontend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/frontend/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" docker/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/docker/

      - name: Health Check
        run: |
          # Wait for application to start
          sleep 30
          
          # Check backend health
          curl -f http://${{ secrets.AWS_HOST }}:3001/api/health || exit 1
          
          # Check frontend health
          curl -f http://${{ secrets.AWS_HOST }}:3000 || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} 'cd ~/skillforge && cp -r backend-backup/* backend/ && cp -r frontend-backup/* frontend/ && docker-compose down && docker-compose up -d'
