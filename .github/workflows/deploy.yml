name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install & Build
        run: |
          npm ci
          cd shared && npm run build && cd ..
          cd backend && npx prisma generate && npm run build && cd ..
          cd frontend && npm run build && cd ..

      - name: Check AWS Secrets
        id: check_aws
        run: |
          if [ -z "${{ secrets.AWS_HOST }}" ] || [ -z "${{ secrets.AWS_SSH_KEY }}" ]; then
            echo "AWS secrets (AWS_HOST / AWS_SSH_KEY) are not set. Skipping EC2 deployment."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure SSH
        if: steps.check_aws.outputs.skip_deploy != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        if: steps.check_aws.outputs.skip_deploy != 'true'
        run: |
          # Backup existing installation on EC2
          ssh -i ~/.ssh/deploy_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} 'mkdir -p ~/skillforge && cp -r ~/skillforge/backend ~/skillforge/backend-backup 2>/dev/null || true && cp -r ~/skillforge/frontend ~/skillforge/frontend-backup 2>/dev/null || true'
          
          # Copy new files
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" backend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/backend/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" frontend/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/frontend/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" docker/ ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/docker/
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" docker-compose.prod.yml ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:~/skillforge/docker-compose.prod.yml

          # Restart containers on server
          ssh -i ~/.ssh/deploy_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} 'cd ~/skillforge && docker-compose -f docker-compose.prod.yml up -d --build'

      - name: Health Check
        if: steps.check_aws.outputs.skip_deploy != 'true'
        run: |
          # Wait for application to start
          sleep 30
          
          # Check backend health
          curl -f http://${{ secrets.AWS_HOST }}:3001/api/health || exit 1
          
          # Check frontend health
          curl -f http://${{ secrets.AWS_HOST }}:3000 || exit 1

      - name: Rollback on failure
        if: failure() && steps.check_aws.outputs.skip_deploy != 'true'
        run: |
          echo "Deployment failed, rolling back..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} 'cd ~/skillforge && cp -r backend-backup/* backend/ 2>/dev/null || true && cp -r frontend-backup/* frontend/ 2>/dev/null || true && docker-compose -f docker-compose.prod.yml down && docker-compose -f docker-compose.prod.yml up -d'
